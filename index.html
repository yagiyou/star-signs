<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Star Ritual → Interactive Cosmos</title>

  <style>
    :root{
      --bg:#05060d;
      --ink:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --line:rgba(255,255,255,.14);
      --glass:rgba(10,12,22,.58);
      --glass2:rgba(10,12,22,.32);
    }
    html,body{
      height:100%; margin:0;
      background:var(--bg); color:var(--ink);
      font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","PingFang TC",Segoe UI,Roboto,Arial;
      scroll-behavior:smooth;
    }
    body{overflow-x:hidden;}

    /* ========== Intro ========== */
    .intro{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      position:relative;
      overflow:hidden;
    }
    .intro::before{
      content:"";
      position:absolute; inset:-30%;
      background:
        radial-gradient(circle at 30% 35%, rgba(140,120,255,.14), rgba(0,0,0,0) 55%),
        radial-gradient(circle at 75% 60%, rgba(120,220,255,.10), rgba(0,0,0,0) 55%),
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.08), rgba(0,0,0,0) 58%);
      filter: blur(2px);
      pointer-events:none;
    }
    .introCard{
      position:relative;
      width:min(720px, 100%);
      border-radius:20px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,var(--glass),var(--glass2));
      backdrop-filter: blur(12px);
      box-shadow:0 30px 90px rgba(0,0,0,.55);
      padding:22px 20px 18px;
    }
    .introCard h1{margin:0 0 10px; font-size:22px; letter-spacing:.4px;}
    .introCard p{margin:0 0 16px; color:var(--muted); line-height:1.7; font-size:14px;}
    .startRow{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:var(--ink);
      padding:12px 16px;
      border-radius:999px;
      cursor:pointer;
      font-size:14px;
      letter-spacing:.2px;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .btn:hover{ transform: translateY(-1px); background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.26); }
    .btn:active{ transform: translateY(0px); }
    .tip{font-size:12px; color:var(--muted);}
    .hint{
      position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
      color:rgba(255,255,255,.55);
      font-size:12px;
      letter-spacing:.3px;
      user-select:none;
    }

    /* ========== 星空區段 ========== */
    .skySection{
      position:relative;
      min-height:100vh;
      overflow:hidden;
    }
    .wrap{position:relative; width:100%; height:100vh; overflow:hidden;}
    canvas{position:absolute; inset:0; width:100%; height:100%;}
    .hud{
      position:absolute; left:16px; top:16px; right:16px;
      display:flex; gap:12px; align-items:flex-start; justify-content:space-between;
      pointer-events:none;
    }
    .pill{
      pointer-events:none;
      display:inline-flex; flex-direction:column; gap:6px;
      padding:12px 14px; border:1px solid var(--line);
      background:linear-gradient(180deg,var(--glass),var(--glass2));
      border-radius:14px; backdrop-filter: blur(10px);
      max-width:min(560px, 100%);
      box-shadow:0 18px 60px rgba(0,0,0,.45);
    }
    .pill b{font-size:14px; letter-spacing:.3px;}
    .pill small{font-size:12px; color:var(--muted); line-height:1.55}
    .status{
      pointer-events:none;
      padding:10px 12px; border:1px solid var(--line);
      background:linear-gradient(180deg,var(--glass),var(--glass2));
      border-radius:999px; backdrop-filter: blur(10px);
      white-space:nowrap;
      font-size:12px; color:var(--muted);
    }

    .modal{
      position:absolute; inset:0; display:none; place-items:center;
      background:rgba(0,0,0,.45);
    }
    .modal.show{display:grid;}
    .card{
      width:min(560px, calc(100% - 28px));
      border-radius:18px;
      border:1px solid rgba(255,255,255,.16);
      background:linear-gradient(180deg, rgba(18,20,38,.86), rgba(12,14,26,.62));
      box-shadow:0 30px 90px rgba(0,0,0,.55);
      backdrop-filter: blur(14px);
      overflow:hidden;
    }
    .card-h{
      padding:16px 18px;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .card-h .title{display:flex; flex-direction:column; gap:4px;}
    .card-h .title b{font-size:15px; letter-spacing:.2px}
    .card-h .title small{font-size:12px; color:var(--muted)}
    .close{
      pointer-events:auto;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:var(--ink);
      border-radius:999px;
      padding:8px 10px;
      cursor:pointer;
      font-size:12px;
    }
    .card-b{padding:16px 18px 18px; line-height:1.75; font-size:14px;}
    .story{white-space:pre-line; color:rgba(255,255,255,.88);}

    video{position:absolute; right:12px; bottom:12px; width:180px; opacity:0; pointer-events:none; border-radius:12px;}

    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto;}
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
</head>

<body>

  <!-- Intro -->
  <section class="intro" id="intro">
    <div class="introCard">
      <h1>🪐 進入星際環境</h1>
      <p>
        點擊 Start 後，畫面將下潛進入互動星空。<br/>
        （同時解鎖聲音；你也可以選擇按 Start 才開相機）
      </p>
      <div class="startRow">
        <button class="btn" id="startBtn" type="button">Start</button>
        <span class="tip">可用滑鼠拖曳／點星座；捏一下（拇指＋食指）也能點。</span>
      </div>
    </div>
    <div class="hint">↓ Start 後會自動下滑</div>
  </section>

  <!-- 星空 -->
  <section class="skySection" id="skySection">
    <div class="wrap">
      <canvas id="sky"></canvas>

      <div class="hud">
        <div class="pill">
          <b>✨ 星空星座故事（手勢版）</b>
          <small>
            手往左右揮：星空跟著移動（視差）<br/>
            捏一下（拇指＋食指）：當作點擊星座<br/>
            沒開相機也能：滑鼠拖曳／點星座
          </small>
        </div>
        <div class="status" id="status">相機：未啟用（按 Start 會啟用）</div>
      </div>

      <video id="video" playsinline></video>

      <div class="modal" id="modal">
        <div class="card">
          <div class="card-h">
            <div class="title">
              <b id="mName">星座</b>
              <small id="mHint">星座解語</small>
            </div>
            <button class="close" id="closeBtn" type="button">關閉</button>
          </div>
          <div class="card-b">
            <div class="story" id="mStory"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    /* =========================
       Start：滑到星空 + 解鎖音效 + 啟用相機
    ========================= */
    const startBtn = document.getElementById("startBtn");
    const skySection = document.getElementById("skySection");

    let audioCtx = null;
    function ensureAudio(){
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === "suspended") audioCtx.resume();
    }

    let handsStarted = false;
    startBtn.addEventListener("click", ()=>{
      ensureAudio();
      skySection.scrollIntoView({ behavior: "smooth", block: "start" });

      // Start 才開相機（更像儀式、也比較不嚇人）
      if(!handsStarted){
        handsStarted = true;
        initHands();
      }
    });

    /* =========================
       互動星空（你之前那套：星座發光+粒子+音效）
    ========================= */
    const CONSTELLATIONS = [
      { id:"orion", name:"獵戶座", x:.28, y:.42, r:28,
        story:"追逐星光太久，忘了回頭。\n直到夜裡有人喊他名字，他才發現——\n守護，也是一種溫柔的獵。",
        tone:{ base:140, shimmer:420, noise:0.06 }, glow:0, pulse:0
      },
      { id:"scorpio", name:"天蠍座", x:.68, y:.58, r:28,
        story:"把刺收進沉默裡，像把祕密藏好。\n不是不信任人，而是怕自己太在乎。\n真正的深情，總是先學會克制。",
        tone:{ base:78, shimmer:260, noise:0.12 }, glow:0, pulse:0
      },
      { id:"leo", name:"獅子座", x:.57, y:.30, r:28,
        story:"牠不是想贏，而是想被看見。\n當你點亮牠的那一刻，牠也照亮了你。\n勇敢，有時只是承認：我需要你。",
        tone:{ base:180, shimmer:520, noise:0.05 }, glow:0, pulse:0
      },
      { id:"pisces", name:"雙魚座", x:.80, y:.36, r:28,
        story:"兩條魚游向相反的夢，卻共享同一片海。\n所以離開不等於背叛，只是各自成長。\n愛，是允許彼此不同方向。",
        tone:{ base:92, shimmer:320, noise:0.10 }, glow:0, pulse:0
      },
      { id:"virgo", name:"處女座", x:.44, y:.66, r:28,
        story:"把混亂一針一線縫成秩序。\n不是挑剔，是想把你放進更好的明天。\n處女座的溫柔，藏在每個小細節。",
        tone:{ base:120, shimmer:360, noise:0.06 }, glow:0, pulse:0
      },
    ];

    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d", { alpha:true });

    const DPR = Math.min(2, window.devicePixelRatio || 1);
    let W=0, H=0;

    let targetShiftX=0, shiftX=0;
    let stars=[];
    let particles=[];

    const modal = document.getElementById("modal");
    const closeBtn = document.getElementById("closeBtn");
    const mName = document.getElementById("mName");
    const mStory = document.getElementById("mStory");

    function rand(min,max){ return Math.random()*(max-min)+min; }
    function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

    function resize(){
      W = Math.floor(window.innerWidth);
      H = Math.floor(window.innerHeight);
      canvas.width = Math.floor(W*DPR);
      canvas.height = Math.floor(H*DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);

      const count = Math.floor((W*H)/7000);
      stars = new Array(count).fill(0).map(()=>({
        x:Math.random()*W,
        y:Math.random()*H,
        z:Math.random(),
        r:rand(.7,1.9),
        a:rand(.25,.95),
        tw:rand(0,Math.PI*2),
        sp:rand(.003,.012)
      }));
    }
    window.addEventListener("resize", resize);
    resize();

    function spawnBurst(x,y,strength=1){
      const n = Math.floor(52*strength);
      for(let i=0;i<n;i++){
        const a = Math.random()*Math.PI*2;
        const sp = (1.2 + Math.random()*3.8) * (0.9 + strength*0.5);
        particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, size:0.7+Math.random()*1.8, tw:Math.random()*Math.PI*2 });
      }
    }
    function stepParticles(){
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.life -= 0.018;
        p.tw += 0.12;
        p.vx *= 0.985; p.vy *= 0.985;
        p.vy -= 0.010;
        p.x += p.vx; p.y += p.vy;
        if(p.life<=0) particles.splice(i,1);
      }
    }
    function drawParticles(){
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      for(const p of particles){
        const t=Math.max(0,p.life);
        const tw=(Math.sin(p.tw)+1)*0.5;
        const alpha=(0.08+tw*0.22)*t;
        ctx.fillStyle=`rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size*(0.8+tw*0.8),0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawConstellations(){
      for(const c of CONSTELLATIONS){
        c.glow = Math.max(0, c.glow - 0.035);
        c.pulse = Math.max(0, c.pulse - 0.060);

        const cx = c.x*W + shiftX*120;
        const cy = c.y*H;

        const gg = ctx.createRadialGradient(cx,cy,0,cx,cy,54+c.glow*30);
        gg.addColorStop(0, `rgba(255,255,255,${0.14 + c.glow*0.26})`);
        gg.addColorStop(.35, `rgba(255,255,255,${0.05 + c.glow*0.12})`);
        gg.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle=gg;
        ctx.beginPath(); ctx.arc(cx,cy,54+c.glow*18,0,Math.PI*2); ctx.fill();

        const pts=[{x:cx-26,y:cy-10},{x:cx-6,y:cy+2},{x:cx+16,y:cy-8}];

        ctx.lineWidth=1;
        ctx.strokeStyle="rgba(255,255,255,.18)";
        ctx.beginPath();
        ctx.moveTo(pts[0].x,pts[0].y);
        for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
        ctx.stroke();

        if(c.glow>0){
          ctx.save();
          ctx.globalCompositeOperation="lighter";
          ctx.shadowColor="rgba(255,255,255,.85)";
          ctx.shadowBlur=18 + c.glow*26;
          for(const w of [2.5,4.5,7.5]){
            ctx.lineWidth=w;
            ctx.strokeStyle=`rgba(255,255,255,${0.05 + c.glow*0.18})`;
            ctx.beginPath();
            ctx.moveTo(pts[0].x,pts[0].y);
            for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
            ctx.stroke();
          }
          ctx.restore();
        }

        const dotR = 3.2 + c.pulse*3.0;
        ctx.fillStyle="rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(cx,cy,dotR,0,Math.PI*2); ctx.fill();

        ctx.fillStyle="rgba(255,255,255,.62)";
        ctx.font="12px ui-sans-serif, system-ui, -apple-system, Noto Sans TC";
        ctx.fillText(c.name, cx+10, cy-12);
      }
    }

    function draw(){
      ctx.clearRect(0,0,W,H);

      const g = ctx.createRadialGradient(W*.55,H*.35,0,W*.55,H*.35,Math.max(W,H)*.9);
      g.addColorStop(0,"rgba(80,90,220,.12)");
      g.addColorStop(.45,"rgba(120,80,220,.06)");
      g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);

      shiftX += (targetShiftX - shiftX) * 0.08;

      for(const s of stars){
        s.tw += s.sp;
        const twinkle=(Math.sin(s.tw)+1)*0.5;
        const px=s.x + shiftX*(40 + s.z*140);
        const alpha=s.a*(0.55 + twinkle*0.45);
        ctx.fillStyle=`rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(px, s.y, s.r*(0.75 + s.z*0.7), 0, Math.PI*2);
        ctx.fill();
      }

      drawConstellations();
      stepParticles();
      drawParticles();

      requestAnimationFrame(draw);
    }
    draw();

    function openStory(c){
      mName.textContent=c.name;
      mStory.textContent=c.story;
      modal.classList.add("show");
    }
    function closeStory(){ modal.classList.remove("show"); }
    closeBtn.addEventListener("click", closeStory);
    modal.addEventListener("click",(e)=>{ if(e.target===modal) closeStory(); });

    function hitTest(x,y){
      for(const c of CONSTELLATIONS){
        const cx=c.x*W + shiftX*120;
        const cy=c.y*H;
        const r=(c.r||26);
        const dx=x-cx, dy=y-cy;
        if(dx*dx + dy*dy <= r*r) return c;
      }
      return null;
    }

    function playStardust(tone){
      ensureAudio();
      const t0=audioCtx.currentTime;

      const out=audioCtx.createGain();
      out.gain.value=0.0001;
      out.connect(audioCtx.destination);

      const osc=audioCtx.createOscillator();
      osc.type="sine";
      osc.frequency.setValueAtTime(tone.base, t0);

      const osc2=audioCtx.createOscillator();
      osc2.type="triangle";
      osc2.frequency.setValueAtTime(tone.shimmer, t0);

      const noise=audioCtx.createBufferSource();
      const buffer=audioCtx.createBuffer(1, audioCtx.sampleRate*0.28, audioCtx.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<data.length;i++){
        data[i]=(Math.random()*2-1)*Math.pow(1 - i/data.length, 2.4);
      }
      noise.buffer=buffer;

      const hp=audioCtx.createBiquadFilter();
      hp.type="highpass"; hp.frequency.value=1300;

      const bp=audioCtx.createBiquadFilter();
      bp.type="bandpass"; bp.frequency.value=520; bp.Q.value=0.6;

      const g1=audioCtx.createGain(); g1.gain.value=0.16;
      const g2=audioCtx.createGain(); g2.gain.value=0.08;
      const gn=audioCtx.createGain(); gn.gain.value=(tone.noise ?? 0.08);

      osc.connect(g1); osc2.connect(g2);
      noise.connect(hp); hp.connect(gn);

      g1.connect(bp); g2.connect(bp); gn.connect(bp);
      bp.connect(out);

      out.gain.setValueAtTime(0.0001, t0);
      out.gain.exponentialRampToValueAtTime(0.20, t0+0.02);
      out.gain.exponentialRampToValueAtTime(0.0001, t0+0.34);

      osc2.frequency.setValueAtTime(tone.shimmer, t0);
      osc2.frequency.exponentialRampToValueAtTime(tone.shimmer*1.22, t0+0.16);

      osc.start(t0); osc2.start(t0); noise.start(t0);
      osc.stop(t0+0.38); osc2.stop(t0+0.38); noise.stop(t0+0.38);
    }

    function activateConstellation(c, px, py){
      c.glow=1; c.pulse=1;
      spawnBurst(px,py,1);
      if(c.tone) playStardust(c.tone);
      openStory(c);
    }

    window.addEventListener("pointerdown",(e)=>{
      if(modal.classList.contains("show")) return;
      const c=hitTest(e.clientX, e.clientY);
      if(c) activateConstellation(c, e.clientX, e.clientY);
    });

    let dragging=false, lastX=0;
    window.addEventListener("pointerdown",(e)=>{ dragging=true; lastX=e.clientX; });
    window.addEventListener("pointerup",()=> dragging=false);
    window.addEventListener("pointercancel",()=> dragging=false);
    window.addEventListener("pointermove",(e)=>{
      if(!dragging) return;
      const dx=e.clientX - lastX;
      lastX=e.clientX;
      targetShiftX = clamp(targetShiftX + dx/W*1.4, -1, 1);
    });

    /* ===== 手勢（按 Start 才會 initHands）===== */
    const statusEl=document.getElementById("status");
    const video=document.getElementById("video");
    let handLandmarker=null, lastVideoTime=-1, camOk=false;
    let pinchDown=false, pinchCooldown=0;

    async function initHands(){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} },
          audio:false
        });
        video.srcObject=stream;
        await video.play();

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions:{
            modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          },
          runningMode:"VIDEO",
          numHands:1,
          minHandDetectionConfidence:0.6,
          minTrackingConfidence:0.6
        });

        camOk=true;
        statusEl.textContent="相機：已啟用（左右揮動／捏一下點星座）";
        requestAnimationFrame(loop);
      }catch(err){
        console.warn(err);
        camOk=false;
        statusEl.textContent="相機：啟用失敗（可改用滑鼠拖曳／點擊）";
      }
    }

    function loop(){
      if(!handLandmarker || !camOk) return;
      if(video.currentTime !== lastVideoTime){
        const res = handLandmarker.detectForVideo(video, performance.now());
        handleHands(res);
        lastVideoTime = video.currentTime;
      }
      requestAnimationFrame(loop);
    }

    function handleHands(res){
      if(!res?.landmarks?.length) return;
      const lm=res.landmarks[0];

      const cx=(lm[0].x + lm[9].x)*0.5;
      const mirroredX=1 - cx;
      targetShiftX = clamp((mirroredX - 0.5)*2, -1, 1);

      const thumb=lm[4], index=lm[8];
      const dx=thumb.x - index.x, dy=thumb.y - index.y;
      const dist=Math.sqrt(dx*dx + dy*dy);
      const isPinching = dist < 0.045;

      if(pinchCooldown>0) pinchCooldown--;

      if(isPinching && !pinchDown && pinchCooldown===0 && !modal.classList.contains("show")){
        pinchDown=true;
        pinchCooldown=16;

        const px=(1 - index.x)*W;
        const py=index.y*H;
        const c=hitTest(px,py);
        if(c) activateConstellation(c, px, py);
      }

      if(!isPinching) pinchDown=false;
    }
  </script>

</body>
</html>
