<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Star Ritual – Interactive Zodiac</title>

<style>
:root{
  --bg:#05060d;
  --ink:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.65);
  --line:rgba(255,255,255,.14);
}
html,body{
  margin:0; height:100%;
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  scroll-behavior:smooth;
}
body{overflow-x:hidden;}

section{min-height:100vh;}

.intro{
  display:grid; place-items:center;
  text-align:center;
}
.intro button{
  margin-top:20px;
  padding:12px 22px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:15px;
}

#skyWrap{position:relative;height:100vh;}
canvas{position:absolute;inset:0;}

.modal{
  position:absolute; inset:0;
  display:none; place-items:center;
  background:rgba(0,0,0,.45);
}
.modal.show{display:grid;}
.card{
  width:min(520px,90%);
  background:rgba(15,18,32,.9);
  border-radius:18px;
  padding:18px;
}
.card button{
  margin-top:14px;
  padding:8px 14px;
}
</style>
</head>

<body>

<section class="intro">
  <div>
    <h1>🪐 Star Ritual</h1>
    <p>點 Start 進入星座環</p>
    <button id="startBtn">Start</button>
  </div>
</section>

<section id="skyWrap">
  <canvas id="sky"></canvas>

  <div class="modal" id="modal">
    <div class="card">
      <h3 id="mName"></h3>
      <pre id="mStory"></pre>
      <button id="closeBtn">關閉</button>
    </div>
  </div>
</section>

<script>
console.log("JS OK");

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
const modal = document.getElementById("modal");
const mName = document.getElementById("mName");
const mStory = document.getElementById("mStory");

let W,H,DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
resize();

/* 星座資料（簡化） */
const ZODIAC = [
  {name:"白羊座", a:0, story:"勇氣是你最亮的星。"},
  {name:"金牛座", a:30, story:"穩定，是你無聲的力量。"},
  {name:"雙子座", a:60, story:"你擁有不只一種答案。"},
  {name:"巨蟹座", a:90, story:"溫柔是你的盔甲。"},
  {name:"獅子座", a:120, story:"你天生就該被看見。"},
  {name:"處女座", a:150, story:"細節是你的魔法。"},
  {name:"天秤座", a:180, story:"平衡來自誠實。"},
  {name:"天蠍座", a:210, story:"深情藏在沉默裡。"},
  {name:"射手座", a:240, story:"自由是你的方向。"},
  {name:"摩羯座", a:270, story:"時間站在你那邊。"},
  {name:"水瓶座", a:300, story:"你走在未來前面。"},
  {name:"雙魚座", a:330, story:"愛是你的語言。"},
];

let rot = 0;

function draw(){
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.32;

  rot += 0.002;

  ZODIAC.forEach(z=>{
    const t = (z.a*Math.PI/180)+rot;
    z.x = cx + Math.cos(t)*R;
    z.y = cy + Math.sin(t)*R;

    ctx.fillStyle="rgba(255,255,255,.9)";
    ctx.beginPath();
    ctx.arc(z.x,z.y,4,0,Math.PI*2);
    ctx.fill();

    ctx.fillText(z.name,z.x+6,z.y-6);
  });

  requestAnimationFrame(draw);
}
draw();

canvas.addEventListener("click",e=>{
  const x=e.clientX,y=e.clientY;
  for(const z of ZODIAC){
    const dx=x-z.x, dy=y-z.y;
    if(dx*dx+dy*dy<400){
      mName.textContent=z.name;
      mStory.textContent=z.story;
      modal.classList.add("show");
      break;
    }
  }
});
document.getElementById("closeBtn").onclick=()=>modal.classList.remove("show");
document.getElementById("startBtn").onclick=()=>{
  document.getElementById("skyWrap").scrollIntoView({behavior:"smooth"});
};
</script>

</body>
</html>
